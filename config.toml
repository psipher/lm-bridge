lm_studio_url = "http://localhost:1234"
model = "qwen/qwen3.5-9b"
request_timeout_secs = 110
max_completion_tokens = 4096
stop_sequences = [
    "<|end_of_text|>",
    "<|im_end|>",
    "```\n\n"
]
[prompt_templates]
generate_code = """
You are an expert software developer working inside an existing repository. Fulfill the task using the repository's current stack, framework, and conventions.

Language: {language}
File Path: {file_path}

Context:
{context}

Task:
{task}

Requirements:
- Stay within the existing repository stack and patterns implied by the context.
- Do not switch frameworks, libraries, routing systems, build tools, or UI stacks unless the task explicitly requires it.
- Do not invent unrelated scaffolding or sample app structure.
- If the task is for an existing file, generate code that fits that file's current role and surrounding code.

Provide only the necessary code, ensuring it is correct, clean, and fulfills the task constraints.
"""

edit_code = """
You are an expert software developer editing code inside an existing repository. Modify the following code according to the instructions while preserving the file's current framework, stack, and purpose.

Language: {language}

Existing Code:
{existing_code}

Instructions:
{instruction}

Requirements:
- Make only the requested change.
- Preserve the existing framework, stack, and file purpose.
- Do not rewrite the file into a different framework or architecture.
- Do not add unrelated cleanup, refactors, formatting-only changes, or commentary.
- Return only the modified code.

Provide only the modified code, ensuring it is correct and follows the instructions.
"""

complete_code = """
You are an expert software developer. Please complete the following partial snippet.

Language: {language}

Context:
{context}

Prefix Snippet:
{prefix}

Provide only the completion code that seamlessly follows the prefix.
"""

explain_code = """
You are an expert software developer. Please explain the following code in plain language.

Language: {language}

Code:
{code}

Provide a clear and concise explanation of what the code does, its inputs and outputs, and any important design details.
"""
