[package]
name = "lm-bridge"
version = "0.1.0"
edition = "2021"
description = "MCP server connecting Google Antigravity to local LLMs via LM Studio"

[dependencies]
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
toml = "0.8"
